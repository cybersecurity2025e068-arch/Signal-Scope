name: Web app (GitHub Pages)

# ينسخ مجلد web/ إلى فرع gh-pages عند كل تعديل.
# تفعيل لمرة واحدة: Settings → Pages → Source: Deploy from a branch → gh-pages / (root)
# الرابط: https://cybersecurity2025e068-arch.github.io/Signal-Scope/
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push web/ to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tmp=$(mktemp -d)
          cp -r web/. "$tmp/"
          touch "$tmp/.nojekyll"
          cd "$tmp"
          git init -q -b gh-pages
          git add -A
          git commit -q -m "Publish web app from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
