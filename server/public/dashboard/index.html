<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>لوحة الراصد · جامعة المعقل الدولية</title>
<meta name="theme-color" content="#FEF8E7">
<!-- هوية جامعة المعقل الدولية مشتركة مع راصد الإشارة وحوض الأمواج (مجلد app على الاستضافة) -->
<script src="../app/brand/amu.js"></script>
<script src="../app/brand/amu-bar.js" data-title="لوحة الراصد" defer></script>
<link rel="icon" href="../app/brand/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Readex+Pro:wght@400;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="dashboard.css">
<link rel="stylesheet" href="../app/brand/amu.css">
</head>
<body>
<div id="auth" class="auth" hidden>
  <form class="card authcard" id="authForm" autocomplete="on">
    <span class="amu-crest" style="width:72px;height:72px;margin:0 auto"><img src="../app/brand/crest.svg" alt="شعار جامعة المعقل الدولية"></span>
    <h1 style="text-align:center">لوحة الراصد</h1>
    <p class="muted" style="text-align:center;margin:-6px 0 0">جامعة المعقل الدولية · قسم هندسة الأمن السيبراني</p>
    <p class="muted" id="authHint">سجّل الدخول لمتابعة الجلسات والتقارير.</p>
    <label class="f" id="setupRow" hidden>رمز الإعداد (setup_key من config.php)<input class="inp" id="aSetup" type="password" dir="ltr" autocomplete="off"></label>
    <label class="f">اسم المستخدم<input class="inp" id="aUser" dir="ltr" autocomplete="username" required></label>
    <label class="f">كلمة المرور<input class="inp" id="aPass" type="password" dir="ltr" autocomplete="current-password" required></label>
    <button class="btn primary" id="aBtn" type="submit">دخول</button>
    <p class="err" id="aErr" hidden></p>
  </form>
</div>

<div id="shell" class="shell" hidden>
  <header class="top">
    <div class="brand amu-hide-embed amu-dup-brand"><span class="amu-crest" style="width:36px;height:36px"><img src="../app/brand/crest.svg" alt="شعار جامعة المعقل الدولية"></span><span>لوحة الراصد<small style="display:block;font-size:11px;font-weight:600;color:var(--muted)">جامعة المعقل الدولية</small></span></div>
    <nav class="nav" id="nav">
      <a href="#/overview">نظرة عامة</a>
      <a href="#/sessions">الجلسات</a>
      <a href="#/coverage">خريطة التغطية</a>
      <a href="#/cells">الأبراج والخلايا</a>
      <a href="#/obstacles">العوائق</a>
      <a href="#/interference">التشويش</a>
      <a href="#/compare">المقارنة</a>
      <a href="#/alerts">التنبيهات <span class="chip alert-cnt" id="navAlerts" hidden></span></a>
      <a href="#/devices">الأجهزة</a>
      <a href="#/settings">الإعدادات</a>
    </nav>
  </header>
  <main id="view" class="view"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script src="vendor/maplibre-gl.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
