# النشر من cPanel ← Git™ Version Control ← Manage ← Pull or Deploy:
#   Update from Remote ثم Deploy HEAD Commit
# يكتشف مجلد المنزل تلقائياً، ولا يلمس signalscope/config.php.
# أول Deploy ينشئ قاعدة البيانات والإعدادات وحساب المدير ومهام cron تلقائياً،
# ويكتب بيانات الدخول في ~/signalscope/SETUP-INFO.txt، والسجل في ~/signalscope/install.log
---
deployment:
  tasks:
    - export HOMEDIR=$(cd ~ && pwd)
    - /bin/mkdir -p $HOMEDIR/public_html/api $HOMEDIR/public_html/dashboard $HOMEDIR/public_html/app $HOMEDIR/signalscope
    - /bin/cp -R server/public/api/. $HOMEDIR/public_html/api/
    - /bin/cp -R server/public/dashboard/. $HOMEDIR/public_html/dashboard/
    - /bin/cp -R web/. $HOMEDIR/public_html/app/
    - /bin/mkdir -p $HOMEDIR/public_html/raasid && /bin/cp -R server/public/raasid/. $HOMEDIR/public_html/raasid/
    - /bin/cp -R server/app/lib server/app/cron server/app/bin server/app/rotate.id server/app/data server/app/bootstrap.php server/app/schema.sql server/app/config.example.php server/app/.htaccess $HOMEDIR/signalscope/
    - cd $HOMEDIR/signalscope && /bin/bash $HOMEDIR/signalscope/bin/auto-setup.sh >> $HOMEDIR/signalscope/install.log 2>&1 || true
