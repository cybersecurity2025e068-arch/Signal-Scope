# النشر من cPanel ← Git™ Version Control ← Manage ← Pull or Deploy ← Deploy HEAD Commit.
# يكتشف مجلد المنزل تلقائياً، فلا حاجة لتعديل هذا الملف. لا يلمس signalscope/config.php.
---
deployment:
  tasks:
    - export HOMEDIR=$(cd ~ && pwd)
    - /bin/mkdir -p $HOMEDIR/public_html/api $HOMEDIR/public_html/dashboard $HOMEDIR/public_html/app $HOMEDIR/signalscope
    - /bin/cp -R server/public/api/. $HOMEDIR/public_html/api/
    - /bin/cp -R server/public/dashboard/. $HOMEDIR/public_html/dashboard/
    - /bin/cp -R web/. $HOMEDIR/public_html/app/
    - /bin/cp -R server/app/lib server/app/cron server/app/data server/app/bootstrap.php server/app/schema.sql server/app/config.example.php server/app/.htaccess $HOMEDIR/signalscope/
